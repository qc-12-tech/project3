# Streamlit 运行配置：隐藏右上角英文工具栏（Deploy / Rerun / Settings ...）与底部水印
# toolbarMode = "minimal" 只保留必要的主菜单，去掉 Deploy 按钮与开发者选项
[client]
toolbarMode = "minimal"
showErrorDetails = true
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[server]
headless = true

[theme]
base = "light"
primaryColor = "#E5484D"      # 与看板里「好评/差评」配色一致
